name: CI

on:
  push:
    branches:
      - dev
      - master
      - legacy-1.1
      - 'consensus/**'
  pull_request:
  workflow_dispatch:
    inputs:
      aevust_branch:
        description: 'Aevust/rincoin branch to build for the new+foreign fork scenario (Scenario 4)'
        required: false
        default: 'feature/port-sim-v1.0.7'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit+functional
            file_env: './ci/test/00_setup_env_native_ci.sh'
          - name: asan+ubsan
            file_env: './ci/test/00_setup_env_native_asan.sh'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CI harness
        env:
          FILE_ENV: ${{ matrix.file_env }}
          MAKEJOBS: '-j4'
        run: ./ci/test_run_all.sh

      - name: Collect test results
        if: always()
        run: |
          mkdir -p artifacts
          # automake test protocol: per-test result files and the unit-test
          # suite output (files may be owned by root from the CI container).
          sudo find . -type f \( -name 'test-suite.log' -o -name '*.trs' -o -name 'test_rincoin.log' -o -name 'config.log' \) -exec cp --parents {} artifacts/ \; 2>/dev/null || true
          # functional test runner logs (kept for failed tests)
          if [ -d ci/scratch/test_runner ]; then sudo cp -r ci/scratch/test_runner artifacts/functional-tests 2>/dev/null || true; fi
          # sanitizer findings, if any
          if [ -d ci/scratch/sanitizer-output ]; then sudo cp -r ci/scratch/sanitizer-output artifacts/sanitizer-output 2>/dev/null || true; fi
          sudo chown -R "$(id -u):$(id -g)" artifacts 2>/dev/null || true
          echo "== Collected test-result files =="; find artifacts -type f | sort || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  # Fork scenario tests (test/functional/feature_fork_*.py): builds the
  # current tree plus labeled reference binaries (old Rincoin releases, and
  # the foreign Aevust/rincoin implementation) and runs the four fork
  # interop scenarios against them. Kept separate from the fast `test`
  # matrix above -- building several extra binaries is expensive and only
  # meaningful once a consensus/<codename> branch actually implements a
  # fork-candidate ruleset, so this only runs on consensus/** pushes and
  # manual dispatch, never on every dev/PR push.
  fork-scenario-tests:
    name: fork-scenario-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: startsWith(github.ref, 'refs/heads/consensus/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --no-upgrade -y \
            python3-zmq python3-pip libevent-dev bsdmainutils \
            libboost-system-dev libboost-filesystem-dev libboost-test-dev libboost-thread-dev \
            libdb5.3++-dev libminiupnpc-dev libzmq3-dev libsqlite3-dev libssl-dev libfmt-dev
          pip3 install --user blake3 argon2-cffi

      - name: Build current tree
        run: |
          ./autogen.sh
          ./configure --disable-dependency-tracking --without-gui --with-incompatible-bdb --with-boost-process
          make -j"$(nproc)"

      - name: Build reference binaries (old Rincoin releases)
        run: |
          test/build_reference_node.py \
            --ref v1.1.0=v1.1.0 \
            --ref v1.0.1=v1.0.1 \
            --out-dir releases

      - name: Build reference binary (Aevust/rincoin, foreign)
        continue-on-error: true
        run: |
          test/build_reference_node.py \
            --foreign "aevust=https://github.com/Aevust/rincoin.git#${{ github.event.inputs.aevust_branch || 'feature/port-sim-v1.0.7' }}" \
            --out-dir releases

      - name: Run fork scenario tests
        env:
          BITCOIND: ${{ github.workspace }}/src/rincoind
          BITCOINCLI: ${{ github.workspace }}/src/rincoin-cli
        run: |
          test/functional/fork_report.py \
            --out-json fork-test-report.json \
            --out-md fork-test-report.md

      - name: Upload fork scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-scenario-results-${{ github.ref_name }}
          path: |
            fork-test-report.json
            fork-test-report.md
          if-no-files-found: warn
          retention-days: 30
