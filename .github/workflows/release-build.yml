name: Build Release Binaries

# Every target builds as its own job so they run in parallel. Building all five
# Linux/Windows targets in one job took just over two hours; the wall time is now
# whichever single target is slowest.
#
# Note on where this file has to live: workflow_dispatch only lists workflows
# that exist on the default branch, but a tag build runs the copy of this file
# from the tagged commit. So a release branch needs this file too -- keeping it
# only on master means tagging there would run whatever old version that branch
# still carries.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for example v1.0.1). Leave empty for an unversioned test build.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two glibc baselines. A binary built against an older glibc runs
          # on newer ones, not the other way round, so the "ubuntu20" build
          # (glibc 2.31) is the one that covers Ubuntu 22.04 (2.35) and
          # Debian 12 (2.36); "ubuntu24" (glibc 2.39) covers Ubuntu 24.04 and
          # Debian 13 (2.41).
          - target: linux-x86_64-ubuntu20
            name: linux x86_64 (glibc 2.31 — Ubuntu 20.04+, Debian 11+)
            needs_db4: true
          - target: linux-x86_64-ubuntu24
            name: linux x86_64 (glibc 2.39 — Ubuntu 24.04+, Debian 13+)
            needs_db4: true
          # aarch64 is cross-compiled from the x86_64 runner, not emulated.
          - target: linux-aarch64-ubuntu20
            name: linux aarch64 (glibc 2.31 — Ubuntu 20.04+, Debian 11+)
            needs_db4: false
          - target: linux-aarch64-ubuntu24
            name: linux aarch64 (glibc 2.39 — Ubuntu 24.04+, Debian 13+)
            needs_db4: false
          - target: windows
            name: windows x64
            needs_db4: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git tar gzip zip rsync

      - name: Verify Docker
        run: |
          # Docker Engine (containerd.io) is pre-installed on GitHub Actions runners;
          # installing docker.io would conflict with it. Just ensure the daemon is up.
          sudo systemctl start docker || true
          sudo chmod 666 /var/run/docker.sock
          docker info

      - name: Install Berkeley DB 4.8
        if: matrix.needs_db4
        run: ./contrib/install_db4.sh "$(pwd)"

      - name: Resolve build tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=""
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-local}" >> "$GITHUB_OUTPUT"
          echo "label=${TAG:-local}" >> "$GITHUB_OUTPUT"

      # depends/ is built from source and is by far the slowest part of a build.
      # Key on the depends tree itself so the cache is dropped the moment a
      # package or its version changes, and keep one cache per target because
      # each host triplet builds its own set.
      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: .build-cache
          key: depends-${{ matrix.target }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/funcs.mk') }}
          restore-keys: |
            depends-${{ matrix.target }}-

      - name: Build ${{ matrix.target }}
        run: |
          # Always build the checked-out commit. The script's clone mode would
          # re-fetch the tag from a remote, which is both slower and a chance for
          # the built source to differ from the commit that triggered the run.
          ARGS=(--local --only "${{ matrix.target }}")
          if [ -n "${{ steps.vars.outputs.tag }}" ]; then
            ARGS+=(--version "${{ steps.vars.outputs.tag }}")
          fi
          ./contrib/build_release.sh "${ARGS[@]}"

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: rincoin-${{ steps.vars.outputs.label }}-${{ matrix.target }}
          path: |
            release-builds/*/tarballs/rincoin-*
            release-builds/*/binaries/**
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 (x86_64) runners are no longer available on GitHub Actions.
          # Uncomment when/if Intel runner support is restored.
          # - runner: macos-13
          #   arch: x86_64
          #   tarball_suffix: x86_64-apple-darwin
          - runner: macos-14
            arch: arm64
            tarball_suffix: arm64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve build tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=""
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-local}" >> "$GITHUB_OUTPUT"
          echo "label=${TAG:-local}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          brew install automake libtool boost miniupnpc pkg-config libevent qt@5 qrencode fmt librsvg

      - name: Install Berkeley DB 4.8
        # Pass --with-mutex=POSIX/pthreads because BDB 4.8 predates Apple Silicon
        # and its configure script cannot auto-detect a mutex implementation on arm64.
        # POSIX pthreads are available on both x86_64 and arm64 macOS.
        run: ./contrib/install_db4.sh "$(pwd)" --with-mutex=POSIX/pthreads

      - name: Build
        run: |
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix qt@5)/lib/pkgconfig:$PKG_CONFIG_PATH"
          export CPPFLAGS="-I$(brew --prefix)/include"
          export LDFLAGS="-L$(brew --prefix)/lib"
          # ax_boost_base.m4 searches only /usr /usr/local /opt /opt/local —
          # /opt/homebrew (Homebrew ARM64 prefix) is absent from that list.
          # Pass the prefix and lib dir explicitly via configure flags so
          # BOOST_LDFLAGS is set correctly before AX_BOOST_SYSTEM runs.
          BOOST_PREFIX="$(brew --prefix boost)"

          # BSD ar (macOS) cannot merge .a archives — it embeds them as file
          # members instead of extracting their object files.  The automake
          # rule for libbitcoin_crypto_base.a uses LIBADD to fold libargon2.a
          # into it, which fails at link time with:
          #   ld: archive member 'libargon2.a' not a mach-o file
          # Wrap ar so that whenever an .a appears in the inputs we use
          # Apple's /usr/bin/libtool -static, which merges archives correctly.
          cat > /tmp/ar-merge.sh << 'AREOF'
          #!/bin/bash
          FLAG="$1"; OUTPUT="$2"; shift 2
          OBJECTS=(); ARCHIVES=()
          for f in "$@"; do
            if [[ "$f" == *.a ]]; then ARCHIVES+=("$f"); else OBJECTS+=("$f"); fi
          done
          rm -f "$OUTPUT"
          if [[ ${#ARCHIVES[@]} -eq 0 ]]; then
            /usr/bin/ar "$FLAG" "$OUTPUT" "${OBJECTS[@]}"
          elif [[ ${#OBJECTS[@]} -gt 0 ]]; then
            /usr/bin/ar cru "$OUTPUT" "${OBJECTS[@]}"
            /usr/bin/libtool -static -o "$OUTPUT" "$OUTPUT" "${ARCHIVES[@]}"
          else
            /usr/bin/libtool -static -o "$OUTPUT" "${ARCHIVES[@]}"
          fi
          AREOF
          chmod +x /tmp/ar-merge.sh
          export AR=/tmp/ar-merge.sh

          ./autogen.sh
          ./configure \
            --with-boost="${BOOST_PREFIX}" \
            --with-boost-libdir="${BOOST_PREFIX}/lib" \
            BDB_LIBS="-L$(pwd)/db4/lib -ldb_cxx-4.8" \
            BDB_CFLAGS="-I$(pwd)/db4/include" \
            --prefix=/ \
            --disable-tests \
            --disable-bench \
            --enable-reduce-exports \
            --with-incompatible-bdb=no \
            --with-gui=qt5
          make -j$(sysctl -n hw.logicalcpu)

      - name: Create DMG
        run: |
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          make deploy
          mv Rincoin-Qt.dmg "Rincoin-Qt-${{ steps.vars.outputs.version }}-${{ matrix.tarball_suffix }}.dmg"

      - name: Package binaries
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          SUFFIX: ${{ matrix.tarball_suffix }}
        run: |
          DIR="rincoin-${VERSION}"
          mkdir -p "${DIR}/bin"
          cp src/rincoind src/rincoin-cli src/rincoin-tx src/rincoin-wallet src/qt/rincoin-qt "${DIR}/bin/"
          cd "${DIR}/bin"
          shasum -a 256 rincoind rincoin-cli rincoin-tx rincoin-wallet rincoin-qt > SHA256SUMS.txt
          cd ../..
          tar czf "rincoin-${VERSION}-${SUFFIX}.tar.gz" "${DIR}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rincoin-${{ steps.vars.outputs.label }}-macos-${{ matrix.arch }}
          path: |
            rincoin-${{ steps.vars.outputs.version }}-${{ matrix.tarball_suffix }}.tar.gz
            Rincoin-Qt-${{ steps.vars.outputs.version }}-${{ matrix.tarball_suffix }}.dmg
          if-no-files-found: error

  # One place that sees every target, so the combined SHA256SUMS covers the whole
  # release rather than whatever one job happened to produce, and so a tag
  # publishes exactly once instead of racing six jobs at the same release.
  collect:
    name: Collect and publish
    needs: [build, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve build tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=""
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-local}" >> "$GITHUB_OUTPUT"
          echo "label=${TAG:-local}" >> "$GITHUB_OUTPUT"

      - name: Download every build artifact
        uses: actions/download-artifact@v6
        with:
          pattern: rincoin-${{ steps.vars.outputs.label }}-*
          path: downloaded

      - name: Assemble the release tree
        run: |
          set -e
          OUT="release/${{ steps.vars.outputs.version }}"
          mkdir -p "$OUT/tarballs" "$OUT/binaries"

          # Linux/Windows jobs upload release-builds/<version>/{tarballs,binaries};
          # macOS jobs upload their tarball and dmg at the top level.
          find downloaded -path '*/tarballs/*' -type f \
               ! -name 'SHA256SUMS.txt' -exec cp -a {} "$OUT/tarballs/" \;
          find downloaded -maxdepth 2 -type f \( -name '*-apple-darwin.tar.gz' -o -name '*.dmg' \) \
               -exec cp -a {} "$OUT/tarballs/" \;
          for d in downloaded/*/release-builds/*/binaries/*; do
            [ -d "$d" ] || continue
            cp -a "$d" "$OUT/binaries/"
          done

          echo "== collected =="
          ls -la "$OUT/tarballs"
          test -n "$(ls -A "$OUT/tarballs")" || { echo "no artifacts collected"; exit 1; }

      - name: Checksum the whole release
        run: |
          cd "release/${{ steps.vars.outputs.version }}/tarballs"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release info
        run: |
          OUT="release/${{ steps.vars.outputs.version }}"
          {
            echo "Rincoin ${{ steps.vars.outputs.version }} release binaries"
            echo
            echo "Built:  $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Tag:    ${{ steps.vars.outputs.label }}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "Artifacts:"
            sed 's/^/  /' "$OUT/tarballs/SHA256SUMS.txt"
            echo
            echo "Each archive also carries an internal SHA256SUMS.txt covering"
            echo "the binaries inside it."
          } > "$OUT/README.txt"
          cat "$OUT/README.txt"

      - name: Upload the combined release artifact
        uses: actions/upload-artifact@v7
        with:
          name: rincoin-${{ steps.vars.outputs.label }}-release
          path: release/
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            release/*/tarballs/*
            release/*/README.txt
